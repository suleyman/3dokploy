[variables]
main_domain = "${domain}"
auth_password = "${password:24}"

[config]
mounts = []

[[config.domains]]
serviceName = "3dokploy"
port = 3_000
host = "${main_domain}"

[config.env]
# The Dokploy on this same server. If its port 3000 is closed, use its public URL instead.
DOKPLOY_URL = "http://host.docker.internal:3000"
# Optional: paste an API key (Settings → Profile → API/CLI) to skip the login screen.
# Leave empty and each visitor enters their own key, kept in their browser.
DOKPLOY_API_KEY = ""
# Site login (user admin). Remove it if you rely on per-visitor keys only.
BASIC_AUTH = "admin:${auth_password}"
